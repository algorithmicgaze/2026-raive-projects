<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>emotion2vec live</title>
    <link rel="icon" href="data:," />
    <script src="./coi-serviceworker.js"></script>
    <style>
      :root {
        color-scheme: light dark;
        --surface: #fcfcfb;
        --panel: #f3f3f1;
        --grid: #e6e6e2;
        --ink: #0b0b0b;
        --ink-secondary: #52514e;
        --ink-muted: #8a8985;
        --accent: #2a78d6;
        --c-sad: #2a78d6;
        --c-surprised: #eb6834;
        --c-neutral: #1baf7a;
        --c-happy: #eda100;
        --c-other: #e87ba4;
        --c-disgusted: #008300;
        --c-fearful: #4a3aa7;
        --c-angry: #e34948;
        --c-unknown: #9a9a96;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --surface: #1a1a19;
          --panel: #232322;
          --grid: #2e2e2c;
          --ink: #ffffff;
          --ink-secondary: #c3c2b7;
          --ink-muted: #8a8985;
          --accent: #3987e5;
          --c-sad: #3987e5;
          --c-surprised: #d95926;
          --c-neutral: #199e70;
          --c-happy: #c98500;
          --c-other: #d55181;
          --c-disgusted: #008300;
          --c-fearful: #9085e9;
          --c-angry: #e66767;
          --c-unknown: #7a7a76;
        }
      }
      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      body {
        margin: 0;
        background: var(--surface);
        color: var(--ink);
        font: 14px/1.4 system-ui, -apple-system, sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      header {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 12px 20px;
        border-bottom: 1px solid var(--grid);
        flex-wrap: wrap;
      }
      h1 {
        font-size: 16px;
        font-weight: 600;
        margin: 0;
      }
      #status {
        color: var(--ink-secondary);
        flex: 1;
        min-width: 200px;
      }
      progress {
        width: 160px;
        accent-color: var(--accent);
      }
      .meta {
        color: var(--ink-muted);
        font-variant-numeric: tabular-nums;
      }
      .meta b {
        color: var(--ink-secondary);
        font-weight: 500;
      }
      button,
      .button {
        display: inline-block;
        font: inherit;
        padding: 6px 16px;
        border-radius: 6px;
        border: 1px solid var(--accent);
        background: var(--accent);
        color: #fff;
        cursor: pointer;
      }
      .button {
        background: var(--panel);
        color: var(--ink);
        border-color: var(--grid);
        margin-left: 6px;
      }
      button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      select {
        font: inherit;
        padding: 5px 8px;
        border-radius: 6px;
        border: 1px solid var(--grid);
        background: var(--panel);
        color: var(--ink);
      }
      main {
        flex: 1;
        display: grid;
        grid-template-columns: 1fr 260px;
        gap: 0;
        min-height: 0;
      }
      .chart-wrap {
        position: relative;
        padding: 16px 12px 12px 12px;
      }
      #chart {
        width: 100%;
        height: 100%;
        min-height: 320px;
        display: block;
      }
      #tooltip {
        position: absolute;
        pointer-events: none;
        background: var(--panel);
        border: 1px solid var(--grid);
        border-radius: 6px;
        padding: 6px 10px;
        font-size: 12px;
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
      }
      #tooltip .muted {
        color: var(--ink-muted);
        margin-bottom: 2px;
      }
      aside {
        background: var(--panel);
        border-left: 1px solid var(--grid);
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      #hero {
        font-size: 34px;
        font-weight: 600;
        line-height: 1.1;
        text-transform: capitalize;
        color: var(--ink-secondary);
      }
      #hero-value {
        color: var(--ink-muted);
        font-variant-numeric: tabular-nums;
      }
      .row {
        display: grid;
        grid-template-columns: 10px 76px 1fr 38px;
        align-items: center;
        gap: 8px;
        height: 22px;
        font-size: 13px;
      }
      .swatch {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 2px;
        margin-right: 6px;
        vertical-align: -1px;
      }
      .row .swatch {
        margin: 0;
      }
      .name {
        color: var(--ink-secondary);
      }
      .track {
        height: 8px;
        background: var(--grid);
        border-radius: 4px;
        overflow: hidden;
      }
      .fill {
        display: block;
        height: 100%;
        width: 0;
        border-radius: 4px;
        transition: width 120ms linear;
      }
      .value {
        text-align: right;
        color: var(--ink-secondary);
        font-variant-numeric: tabular-nums;
      }
      .level-wrap {
        margin-top: auto;
      }
      .level-head {
        display: flex;
        justify-content: space-between;
        color: var(--ink-muted);
        font-size: 12px;
        margin-bottom: 4px;
      }
      .level-track {
        position: relative;
        height: 6px;
        background: var(--grid);
        border-radius: 3px;
        overflow: hidden;
      }
      #level {
        display: block;
        height: 100%;
        width: 0;
        background: var(--ink-muted);
        transition: width 60ms linear;
      }
      #level.open {
        background: var(--accent);
      }
      .gate {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 1px;
        background: var(--ink);
        left: 25%;
      }
      @media (max-width: 720px) {
        main {
          grid-template-columns: 1fr;
        }
        aside {
          border-left: 0;
          border-top: 1px solid var(--grid);
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>emotion2vec live</h1>
      <span id="status">Loading…</span>
      <progress id="progress" max="1"></progress>
      <span class="meta">backend <b id="ep">–</b></span>
      <span class="meta">inference <b id="latency">–</b></span>
      <label class="meta">window
        <select id="window">
          <option value="1">1 s</option>
          <option value="2">2 s</option>
          <option value="3" selected>3 s</option>
          <option value="5">5 s</option>
        </select>
      </label>
      <span id="sources" hidden>
        <button id="start-mic">Start mic</button>
        <label class="button">Play file… <input id="file" type="file" accept="audio/*" hidden /></label>
      </span>
      <button id="stop" hidden>Stop</button>
    </header>
    <main>
      <div class="chart-wrap">
        <canvas id="chart"></canvas>
        <div id="tooltip" hidden></div>
      </div>
      <aside>
        <div>
          <div id="hero">idle</div>
          <div id="hero-value">&nbsp;</div>
        </div>
        <div id="bars"></div>
        <div class="level-wrap">
          <div class="level-head"><span>mic level · gate −45 dB</span><span id="level-label"></span></div>
          <div class="level-track"><span id="level"></span><span class="gate"></span></div>
        </div>
      </aside>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
