[project]
name = "emotion2vec-coreml"
version = "0.1.0"
description = "Converts emotion2vec+ base to a Core ML model"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch",
    "funasr",
    "modelscope",
    "coremltools>=9",
    "huggingface-hub",
    "numpy",
]

[tool.uv]
package = false
