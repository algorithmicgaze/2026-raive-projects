<!doctype html><meta charset="utf-8"><title>ort webgpu bench</title>
<script type="module">
const q = new URLSearchParams(location.search);
const ortDir = q.get('ortDir');
const ort = await import('file://' + ortDir + '/ort.webgpu.min.mjs');
ort.env.wasm.wasmPaths = 'file://' + ortDir + '/';
const result = { model: q.get('model'), frames: Number(q.get('frames')) };
try {
  const adapter = await navigator.gpu.requestAdapter({ powerPreference: 'high-performance' });
  const info = adapter.info || {};
  result.adapter = { vendor: info.vendor, architecture: info.architecture, description: info.description, f16: adapter.features.has('shader-f16') };
  const bytes = new Uint8Array(await (await fetch('file://' + result.model)).arrayBuffer());
  const t0 = performance.now();
  const session = await ort.InferenceSession.create(bytes, { executionProviders: ['webgpu'] });
  result.loadMs = Math.round(performance.now() - t0);
  const [, , h, w] = session.inputMetadata[0].shape;
  const x = new ort.Tensor('float32', new Float32Array(3 * h * w).map(() => Math.random() * 2 - 1), [1, 3, h, w]);
  const name = session.inputNames[0];
  await session.run({ [name]: x }); // warm-up (shader compilation)
  const t1 = performance.now();
  for (let i = 0; i < result.frames; i++) await session.run({ [name]: x });
  const ms = (performance.now() - t1) / result.frames;
  result.msPerFrame = Math.round(ms * 10) / 10;
  result.fps = Math.round(1000 / ms * 10) / 10;
  result.size = `${w}x${h}`;
} catch (e) {
  result.error = String(e && e.stack ? e.stack : e);
}
window.bench.report(result);
</script>
